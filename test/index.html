<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>CCR test</title>
<style>
  .ccr-test-locked { overflow: hidden; }
  body { font-family: sans-serif; margin: 0; padding: 20px; }
  .fixed { position: fixed; left: 0; right: 0; bottom: 0; background: #eee; padding: 16px; border-top: 2px solid #999; }
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: flex; align-items: center; justify-content: center; }
  .box { background: #fff; padding: 20px; max-width: 520px; }
  .hidden { display: none; }
  .sw { display: inline-block; width: 30px; height: 16px; background: #ccc; border-radius: 8px; }
  .sw[aria-checked="true"] { background: #36c; }
</style>
</head>
<body>
<h1>Strona testowa</h1>
<p>Treść artykułu. W stopce link do <a href="/polityka">polityki cookies</a>.</p>
<div id="app"></div>
<pre id="out"></pre>
<script>
  // ---- stub chrome API ----
  window.__reports = [];
  window.__walls = [];
  // czy wtyczka kiedykolwiek ukryła jakiś element (clip-path w stylu inline)
  new MutationObserver(ms => { for (const m of ms) if (m.target.style && m.target.style.clipPath) window.__clipEver = true; })
    .observe(document.documentElement, { subtree: true, attributes: true, attributeFilter: ['style'] });
  // czy kliknięty element był ukryty (clip-path wtyczki na nim lub przodku, także przez Shadow DOM)
  document.addEventListener('click', e => {
    const path = e.composedPath().filter(n => n.nodeType === 1);
    (window.__clickHidden ||= []).push(path.some(n => getComputedStyle(n).clipPath !== 'none'));
    (window.__clickScroll ||= []).push([document.documentElement, document.body].every(n => getComputedStyle(n).overflowY !== 'hidden'));
  }, true);
  const params = new URLSearchParams(location.search);
  const settings = JSON.parse(JSON.stringify({
    enabled: true, granular: true, fallback: 'reject', infoBanner: 'hide', notifications: true, debug: true, disabledSites: [],
    wall: { mode: 'ask', onDecline: 'nothing', remember: true },
    categories: { necessary: true, functional: true, analytics: false, marketing: false, personalization: false, social: false, thirdParty: false, legitimateInterest: false, other: false }
  }));
  if (params.get('onlyNecessary')) settings.categories.functional = false;
  if (!params.get('ext')) window.chrome = {
    runtime: {
      sendMessage: async (msg) => {
        if (msg.type === 'init') return { settings, topHost: location.hostname, disabled: false };
        if (msg.type === 'handled') { window.__reports.push(msg); return { ok: true }; }
        if (msg.type === 'wall' && params.get('wall')) { window.__walls.push(msg); return { decision: params.get('wall') }; }
        if (msg.type === 'wall') { window.__walls.push(msg); const r =await CCR_UI.askWall({ kind: msg.kind, host: location.hostname, onDecline: 'nothing', remember: true }); return { decision: r.decision }; }
      },
      onMessage: { addListener() {} }
    }
  };

  const cases = {
    // OneTrust-podobny: baner + osobny panel z checkboxami
    onetrust: `
      <div class="fixed" id="cookie-banner">
        <p>Używamy plików cookie i podobnych technologii, aby personalizować reklamy. Twoja prywatność jest ważna.</p>
        <button id="acc" onclick="done('accept-all')">Akceptuj wszystkie</button>
        <button onclick="document.getElementById('pc').classList.remove('hidden'); document.getElementById('cookie-banner').classList.add('hidden')">Ustawienia plików cookie</button>
      </div>
      <div class="overlay hidden" id="pc"><div class="box">
        <h2>Centrum preferencji prywatności</h2>
        <div><h4>Ściśle niezbędne pliki cookie</h4><input type="checkbox" id="c1" checked disabled><label for="c1">Zawsze aktywne</label></div>
        <div><h4>Funkcjonalne pliki cookie</h4><p>Zapamiętują Twoje preferencje.</p><input type="checkbox" id="c3"></div>
        <div><h4>Wydajnościowe pliki cookie</h4><p>Pozwalają liczyć odwiedziny.</p><input type="checkbox" id="c2" checked></div>
        <div><h4>Pliki cookie do celów reklamowych</h4><input type="checkbox" id="c4" checked></div>
        <div><h4>Media społecznościowe</h4><input type="checkbox" id="c5" checked></div>
        <button onclick="done('save')">Zapisz ustawienia</button>
        <button onclick="done('accept-all')">Zezwól na wszystkie</button>
      </div></div>`,
    // Prosty baner z "Odrzuć"
    reject: `
      <div class="fixed"><p>Ta strona korzysta z ciasteczek w celach analitycznych i marketingowych.</p>
        <button onclick="done('accept')">Akceptuję</button> <button onclick="done('reject')">Odrzuć wszystkie</button></div>`,
    // TCF z przełącznikami role=switch i zakładką uzasadnionego interesu
    tcf: `
      <div class="overlay" role="dialog" aria-modal="true" id="tcf"><div class="box">
        <p>Cenimy Twoją prywatność. My i nasi partnerzy (842) przechowujemy informacje na urządzeniu (cookies) i przetwarzamy dane osobowe.</p>
        <button onclick="done('accept')">Zgadzam się</button>
        <button onclick="document.getElementById('purposes').classList.remove('hidden')">Więcej opcji</button>
        <div id="purposes" class="hidden">
          <div class="p"><b>Przechowywanie informacji na urządzeniu</b> <span class="sw" role="switch" aria-checked="false" aria-label="Zgoda" onclick="tg(this)"></span></div>
          <div class="p"><b>Wybór spersonalizowanych reklam</b> <span class="sw" role="switch" aria-checked="false" aria-label="Zgoda" onclick="tg(this)"></span> <span class="sw" role="switch" aria-checked="true" aria-label="Uzasadniony interes" onclick="tg(this)"></span></div>
          <div class="p"><b>Pomiar wydajności treści</b> <span class="sw" role="switch" aria-checked="false" aria-label="Zgoda" onclick="tg(this)"></span> <span class="sw" role="switch" aria-checked="true" aria-label="Uzasadniony interes" onclick="tg(this)"></span></div>
          <div class="p"><b>Funkcjonalność</b> <span class="sw" role="switch" aria-checked="false" aria-label="Zgoda" onclick="tg(this)"></span></div>
          <button onclick="done('save')">Zapisz i wyjdź</button>
        </div>
      </div></div>`,
    // "Zgoda albo płać"
    pay: `
      <div class="overlay"><div class="box"><h2>Reklamy finansują nasz serwis</h2>
        <p>Zaakceptuj cookies i zgody na przetwarzanie danych przez partnerów albo wykup subskrypcję bez reklam za 9,99 zł/mies.</p>
        <button onclick="done('accept')">Akceptuj i przejdź do serwisu</button> <button onclick="done('pay')">Wykup subskrypcję</button></div></div>`,
    // Odwzorowanie wp.pl: ekran zgód → ustawienia zaawansowane → "odrzucam i płacę"
    wp: `
      <div style="position:fixed;inset:0;background:rgba(0,0,0,.4)" id="wpwrap"><div role="dialog" style="position:absolute;inset:40px;background:#fff;padding:20px;overflow:auto" id="wpd"></div></div>`,
    // Baner informacyjny
    info: `<div class="fixed" style="bottom:0;top:auto"><span>Ta strona używa plików cookies. Korzystając z niej zgadzasz się na ich użycie.</span> <button onclick="done('ok')">OK</button></div>`,
    // Okienko cookie z przyciskami, których wtyczka nie rozpoznaje → propozycja zgłoszenia
    unrecognized: `
      <div class="overlay" id="unrec"><div class="box"><h2>Pliki cookie i RODO</h2>
        <p>Ta strona używa plików cookie. Zgodnie z RODO prosimy o decyzję w sprawie przetwarzania danych przez partnerów.</p>
        <span role="button" tabindex="0" onclick="done('dalej')">Dalej</span> <span role="button" tabindex="0" onclick="done('info')">Informacje</span></div></div>`,
    // "Odrzuć" nie działa (okienko zostaje) → nie akceptujemy na ślepo, proponujemy zgłoszenie
    stuck: `
      <div class="overlay" id="stuck"><div class="box"><p>Używamy plików cookie w celach analitycznych i reklamowych.</p>
        <button onclick="window.__rejectTried=(window.__rejectTried||0)+1">Odrzuć wszystkie</button>
        <button onclick="done('accept')">Akceptuję</button></div></div>`,
    // Obsługa trwa za długo (setki przełączników partnerów, a strona przetwarza każde kliknięcie ~40 ms)
    // → przerwanie po limicie czasu, bez dalszych kliknięć, i propozycja zgłoszenia
    slow: `
      <div class="overlay" id="slow"><div class="box" style="max-height:80vh;overflow:auto"><p>Używamy plików cookie w celach analitycznych i reklamowych. Wybierz partnerów.</p>
        <button onclick="document.getElementById('slowp').style.display='block'">Ustawienia</button>
        <button onclick="done('accept')">Akceptuję wszystkie</button>
        <div id="slowp" style="display:none"><button onclick="">Zapisz wybór</button>
          ${Array.from({ length: 600 }, (_, i) => `<div>Partner reklamowy ${i + 1} <span role="switch" aria-checked="true" tabindex="0" onclick="slowClick()">wł.</span></div>`).join('')}
        </div></div></div>`,
    // "Odrzuć" pozornie działa: okienko znika i po chwili wraca → propozycja zgłoszenia
    reappear: `
      <div class="overlay" id="reap"><div class="box"><p>Używamy plików cookie w celach analitycznych i reklamowych.</p>
        <button onclick="window.__rejectTried=(window.__rejectTried||0)+1;const o=document.getElementById('reap');o.style.display='none';setTimeout(()=>o.style.display='',1000)">Odrzuć wszystkie</button>
        <button onclick="done('accept')">Akceptuję</button></div></div>`,
    // Powłoka aplikacji (np. github.com): pełnoekranowy kontener strony z „Manage cookies” w stopce — to nie baner
    shell: `
      <div style="position:fixed;inset:0;overflow:auto;background:#fff" id="shell">
        <header><nav><a href="#">Repositories</a> <button>Search</button></nav></header>
        <main><h2>My repositories</h2><p>${'Lorem ipsum dolor sit amet. '.repeat(20)}</p><button>New repository</button></main>
        <footer><a href="/terms">Terms</a> <a href="/privacy">Privacy</a> <button onclick="done('manage-cookies')">Manage cookies</button></footer>
      </div>`,
    // consentmanager (np. g2a.com): shadow root, warstwa powitalna → warstwa ustawień (budowana w cmpSetup)
    cmp: `<div id="cmpwrapper"></div>`,
    // Bramka płatności (jak Przelewy24): pełnoekranowe okno z kwotą i metodami płatności, wzmianka o cookies,
    // „Akceptuję” i „Zapłać” — to NIE jest ściana „zgoda albo płać”: nic nie klikamy, nie ukrywamy, nie pytamy
    gateway: `
      <div style="position:fixed;inset:0;z-index:100;background:#556">
        <div style="position:absolute;left:10%;right:10%;top:20px;background:#fff;padding:16px">
          <p><b>Przelewy24</b> <span>14:30</span></p>
          <p>DO ZAPŁATY <b>3128,00 PLN</b> — oponeo</p>
          ${['Przelew online', 'BLIK', 'Visa Mobile', 'Płatność kartą', 'Google Pay', 'Apple Pay', 'PayPo']
            .map(m => `<div style="cursor:pointer;border:1px solid #ddd;padding:6px;margin:4px 0" onclick="done('pay-method')">${m}</div>`).join('')}
          <button onclick="done('accept')">Akceptuję</button> <button onclick="done('pay')">Zapłać</button>
          <p style="font-size:11px">Płacąc akceptujesz Regulamin Przelewy24. Administratorem Twoich danych osobowych jest spółka PayPro S.A.
            Serwis używa plików cookies niezbędnych do realizacji płatności. <a href="#">Czytaj całość</a></p>
        </div>
      </div>`,
    // Panel ustawień jak na oponeo.pl: osobne pływające okno (bez roli dialog) wstawiane po chwili,
    // przełączniki rysowane CSS-em (div-tor + okrągła gałka em), bez input/role/aria — stan tylko w wyglądzie
    visual: `
      <div id="visapp"><footer>
        <div style="position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,.4)">
          <div style="position:fixed;bottom:0;left:0;right:0;background:#fff;padding:16px">
            <p>Dbamy o Twoją prywatność! Korzystamy z plików cookies w celach analitycznych i marketingowych.</p>
            <button onclick="done('accept')">Zgadzam się</button> <button onclick="done('reject')">Nie zgadzam się</button>
            <button onclick="setTimeout(visOpen, 300)">Ustawienia</button>
          </div>
        </div>
      </footer></div>`,
    // Okienko własne strony (np. oponeo.pl, Next.js + Tailwind): głęboko w stopce, klasy bez znaczenia,
    // pełnoekranowe przyciemnienie z panelem, „przyciski” to div-y z kursorem-łapką (bez roli i tabindex)
    deep: `
      <div class="flex min-h-screen"><main class="grow"><p>${'Opony zimowe w najlepszych cenach. '.repeat(15)}</p></main>
        <footer class="mt-4 bg-gray-100"><div class="grid gap-2"><a href="/polityka">Polityka prywatności</a></div>
          <div class="fixed left-0 top-0 z-[10000] h-full w-full bg-[rgba(0,0,0,0.4)]" style="position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,.4)">
            <div class="fixed bottom-0 grid w-full" style="position:fixed;bottom:0;left:0;right:0;background:#fff;padding:16px">
              <p class="text-lg font-bold">Dbamy o Twoją prywatność!</p>
              <p class="text-sm">Korzystamy z plików cookies i innych podobnych technologii. Wiąże się to z przetwarzaniem danych osobowych w celach analitycznych i marketingowych.</p>
              <div class="flex gap-2">
                <div class="rounded px-4 py-2" style="cursor:pointer" onclick="done('accept')">Zgadzam się</div>
                <div class="rounded px-4 py-2" style="cursor:pointer" onclick="done('reject')"><span>Nie zgadzam się</span></div>
              </div>
            </div>
          </div>
        </footer>
      </div>`,
    // Ściana bez płatności (tylko akceptuj, pełnoekranowa)
    wall: `
      <div class="overlay"><div class="box"><p>Aby korzystać z serwisu, musisz zaakceptować pliki cookie i przetwarzanie danych (RODO).</p>
        <button onclick="done('accept')">Akceptuję</button></div></div>`
  };
  function slowClick() {
    window.__toggleClicks = (window.__toggleClicks || 0) + 1;
    for (const t = performance.now(); performance.now() - t < 40;); // strona przetwarza kliknięcie ~40 ms
  }
  function tg(el) { el.setAttribute('aria-checked', el.getAttribute('aria-checked') === 'true' ? 'false' : 'true'); }
  function done(what) {
    const state = {};
    document.querySelectorAll('input[type=checkbox]').forEach(i => state[i.id] = i.checked);
    document.querySelectorAll('[role=switch]').forEach((s, i) => state['sw' + i] = s.getAttribute('aria-label') + ':' + s.getAttribute('aria-checked'));
    window.__clicked = { what, state };
    document.getElementById('app').innerHTML = '';
    document.body.style.overflow = ''; document.documentElement.classList.remove('ccr-test-locked');
  }
  const c = params.get('case') || 'onetrust';
  const wpScreens = {
    main: `<h2>Cenimy Twoją prywatność</h2><p>Kliknij „AKCEPTUJĘ I PRZECHODZĘ DO SERWISU”, aby wyrazić zgodę na korzystanie w Internecie z technologii automatycznego gromadzenia danych (cookies) przez Wirtualną Polskę i Zaufanych Partnerów IAB (1037 partnerów). Możesz podjąć decyzję w ramach <span tabindex="0" onclick="wpShow('adv')" style="color:blue">ustawień zaawansowanych</span>.</p>
      <button onclick="done('accept')">Akceptuję i przechodzę do serwisu</button> <button onclick="wpShow('pay')">Odrzucam i chcę dowiedzieć się więcej</button>`,
    adv: `<h2>Ustawienia Zaawansowane</h2><p>Poniżej opisujemy cele i funkcje przetwarzania Twoich danych osobowych.</p>
      ${['1. Wykorzystywanie ograniczonych danych do wyboru reklam', '2. Tworzenie profili w celu spersonalizowanych reklam', '7. Pomiar efektywności treści', '8. Rozumienie odbiorców dzięki statystyce'].map(t => `<div class="p"><div>${t}</div><div><div role="switch" class="sw" aria-checked="false" onclick="tg(this)"></div><span>Zgoda</span></div></div>`).join('')}
      <div class="p"><div>9. Rozwój i ulepszanie usług</div><div><div role="switch" class="sw" aria-checked="true" onclick="tg(this)"></div><span>Uzasadniony interes</span></div></div>
      <button onclick="done('accept-all')">Włączam wszystko, przechodzę do serwisu</button> <button onclick="window.__wpSaved=[...document.querySelectorAll('[role=switch]')].map(s=>s.getAttribute('aria-checked'));wpShow('pay')">Zapisuję i chcę dowiedzieć się więcej</button>`,
    pay: `<h2>Odrzucam zgody i płacę od 5,75 do 7,50 zł / miesiąc</h2><p>Wirtualna Polska oferuje wszystkie swoje treści za darmo, tak długo, jak zarabia na reklamach. Jeśli chcesz nam uniemożliwić dopasowywanie reklam do Ciebie, dajemy alternatywę w postaci symbolicznego abonamentu.</p>
      <button onclick="done('accept')">Nie chcę płacić, jednak akceptuję zgody</button> <button onclick="done('pay')">Nadal odrzucam, chcę zapłacić</button>`
  };
  function visRow(title, desc, on) {
    return `<div style="display:grid;grid-template-columns:1fr 50px;gap:8px;padding:6px 0;border-bottom:1px solid #ddd">
      <div><b>${title}</b><p style="margin:2px 0;font-size:12px">${desc}</p></div>
      ${on === null ? '<span>Wymagane</span>' : `<div class="vt" data-on="${on ? 1 : 0}" onclick="visToggle(this)" style="cursor:pointer;width:40px;height:20px;border:1px solid #888;border-radius:10px;box-sizing:border-box;position:relative;background:${on ? '#2a6' : '#ccc'}">
        <em style="display:block;width:16px;height:16px;border-radius:50%;background:#fff;position:absolute;top:1px;left:1px;transition:transform .2s;transform:translateX(${on ? 20 : 0}px)"></em></div>`}
    </div>`;
  }
  function visToggle(t) {
    const on = t.dataset.on !== '1';
    t.dataset.on = on ? '1' : '0';
    t.style.background = on ? '#2a6' : '#ccc';
    t.firstElementChild.style.transform = `translateX(${on ? 20 : 0}px)`;
  }
  function visOpen() {
    const w = document.createElement('div');
    w.style.cssText = 'position:fixed;inset:0;z-index:9999;background:transparent';
    w.innerHTML = `<div style="position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:420px;max-height:80vh;overflow:auto;background:#fff;padding:16px">
      <h3>Ustawienia plików cookies</h3><p>Poniżej możesz sprawdzić, jakie dane zbieramy w ciasteczkach i po co.</p>
      <div class="rows"></div>
      <button onclick="window.__vis=[...document.querySelectorAll('.vt')].map(v=>v.dataset.on);done('save')">Zapisz ustawienia zgód</button>
      <button onclick="done('accept-all')">Zgoda na wszystkie</button>
      <button onclick="done('reject-all')">Odrzuć wszystkie</button></div>`;
    document.getElementById('visapp').appendChild(w);
    // zawartość panelu dochodzi chwilę po samym oknie
    setTimeout(() => {
      w.querySelector('.rows').innerHTML = visRow('Niezbędne', 'Są niezbędne, by strona działała prawidłowo.', null) +
        visRow('Funkcjonalne', 'Zapamiętywanie Twoich preferencji i ustawień strony.', false) +
        visRow('Poznanie zachowań użytkownika', 'Zgadzam się na przetwarzanie danych w celu prowadzenia analiz i statystyk.', true) +
        visRow('Marketing', 'Zgadzam się na wyświetlanie spersonalizowanych reklam.', true);
    }, 200);
  }
  function cmpSetup() {
    const sr = document.getElementById('cmpwrapper').attachShadow({ mode: 'open' });
    const purposes = ['Przechowywanie informacji na urządzeniu lub dostęp do nich', 'Tworzenie profili w celu spersonalizowanych reklam', 'Pomiar efektywności treści'];
    const row = (label, i) => `<tr><td>${label}</td><td><a href="#" class="cmpvendurl" aria-label="Opis: ${label}" onclick="window.__opisClicked=(window.__opisClicked||0)+1;return false"><span style="display:inline-block;width:12px;height:12px;background:#999"></span></a> <a href="#" class="cmptogglelink" role="checkbox" aria-checked="false" aria-label="${label}" onclick="tg(this);return false">${i}</a></td></tr>`;
    const welcome = `<div style="position:fixed;inset:0;background:rgba(0,0,0,.4)"><div id="cmpbox" class="cmpbox cmpbox1" role="dialog" aria-modal="true" style="position:absolute;inset:40px;background:#fff;overflow:auto;padding:16px">
      <p>Ta strona używa plików cookie. My i nasi partnerzy przetwarzamy dane osobowe w celach reklamowych.</p>
      <a href="#" class="cmpboxbtn cmpboxbtnyes cmptxt_btn_yes" onclick="done('accept');return false">Akceptuj wszystko</a>
      <a href="#" class="cmpboxbtn cmpboxbtncustom cmptxt_btn_custom" id="cmpcustom">Ustawienia</a></div></div>`;
    const custom = `<div style="position:fixed;inset:0;background:rgba(0,0,0,.4)"><div id="cmpbox" class="cmpbox cmpbox2" role="dialog" aria-modal="true" style="position:absolute;inset:40px;background:#fff;overflow:auto;padding:16px">
      <p>Ustawienia. Niektórzy dostawcy przetwarzają dane na podstawie uzasadnionego interesu.</p>
      <a href="#" class="cmpvendurl" aria-label="Opis: Uzasadniony interes dostawców" onclick="window.__opisClicked=(window.__opisClicked||0)+1;return false"><span style="display:inline-block;width:12px;height:12px;background:#999"></span></a>
      <table><tbody>${purposes.map(row).join('')}${Array.from({ length: 300 }, (_, i) => row('Dostawca reklamowy ' + (i + 1), i)).join('')}</tbody></table>
      <a href="#" class="cmpboxbtn cmpboxbtnyes cmpboxbtnyescustomchoices cmptxt_btn_save" onclick="done('save');return false">Zapisz i wyjdź</a>
      <a href="#" class="cmpboxbtn cmpboxbtnreject cmpboxbtnrejectcustomchoices cmptxt_btn_no" onclick="done('reject');return false">Odrzuć wszystko</a></div></div>`;
    sr.innerHTML = welcome;
    sr.getElementById('cmpcustom').onclick = () => { sr.innerHTML = custom; return false; };
    window.__cmpState = () => [...sr.querySelectorAll('[role=checkbox]')].filter(e => e.getAttribute('aria-checked') === 'true').length;
  }
  // done() w shadow root nie widzi przełączników — zapisz ich stan osobno
  const doneBase = done;
  done = what => { const on = window.__cmpState ? window.__cmpState() : null; doneBase(what); if (on !== null) window.__clicked.cmpOn = on; };
  function wpShow(s) { document.getElementById('wpd').innerHTML = wpScreens[s]; }
  // wstaw z opóźnieniem jak prawdziwy CMP
  setTimeout(() => {
    document.getElementById('app').innerHTML = cases[c];
    // blokada przewijania jak w prawdziwych CMP: inline (reject) i przez klasę (tcf); done() ją zdejmuje
    if (c === 'reject') document.body.style.overflow = 'hidden';
    if (c === 'tcf') document.documentElement.classList.add('ccr-test-locked');
    if (c === 'wp') { wpShow('main'); document.body.style.overflow = 'hidden'; }
    if (c === 'cmp') cmpSetup();
  }, 300);
  // ?ext=1 → test z prawdziwie zainstalowanym rozszerzeniem (bez stubów i bez wstrzykiwania silnika)
  if (!params.get('ext')) {
    (async () => {
      for (const f of ['shared', 'rules', 'ui', 'content']) {
        await new Promise(res => { const s = document.createElement('script'); s.src = '../src/' + f + '.js'; s.onload = res; document.body.appendChild(s); });
      }
    })();
  }
</script>
</body>
</html>
